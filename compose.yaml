services:
  voice-bubble:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      AUTH_MODE: oauth
      PUBLIC_BASE_URL: https://${VOICE_BUBBLE_DOMAIN:?Set VOICE_BUBBLE_DOMAIN in .env}
      DATA_DIR: /app/.data
      ENABLE_TEST_HOST: "false"
    volumes:
      - voice-data:/app/.data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VOICE_BUBBLE_DOMAIN: ${VOICE_BUBBLE_DOMAIN:?Set VOICE_BUBBLE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      voice-bubble:
        condition: service_healthy
volumes:
  voice-data:
  caddy-data:
  caddy-config:
